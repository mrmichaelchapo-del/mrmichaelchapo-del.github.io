<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael · profile</title>
  <!-- Google Fonts + Font Awesome for icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f7 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1e293b;
    }

    .profile-card {
      max-width: 550px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem 2.2rem;
      box-shadow: 
        0 20px 40px -12px rgba(0, 20, 30, 0.25),
        0 8px 24px -6px rgba(0, 0, 0, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 30px 50px -16px rgba(0, 30, 50, 0.3),
        0 12px 28px -8px rgba(0, 0, 0, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    /* avatar + ring */
    .avatar-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .avatar-ring {
      background: linear-gradient(135deg, #ffffff, #dfe9f3);
      padding: 6px;
      border-radius: 50%;
      box-shadow: 0 10px 20px -8px rgba(0, 40, 60, 0.2);
    }

    .avatar {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      background: #d9e2ec;
      transition: transform 0.2s ease;
    }

    .avatar:hover {
      transform: scale(1.02);
    }

    /* name & role */
    .name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b1a2b;
      margin-bottom: 0.15rem;
      line-height: 1.2;
    }

    .role {
      font-size: 1rem;
      font-weight: 500;
      color: #3a5e7a;
      background: rgba(214, 232, 246, 0.7);
      display: inline-block;
      padding: 0.3rem 1.1rem;
      border-radius: 40px;
      letter-spacing: 0.2px;
      margin-bottom: 1.4rem;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .bio {
      font-size: 0.98rem;
      color: #2f4052;
      margin-bottom: 1.8rem;
      padding: 0 0.75rem;
      font-weight: 400;
      line-height: 1.6;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* stats row */
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1.6rem 0 1.8rem;
      padding: 0.25rem 0;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .stat-value {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0e293b;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #5f7d9c;
      margin-top: 0.15rem;
    }

    /* divider */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(148, 178, 204, 0.4), transparent);
      margin: 0.5rem 0 1.5rem;
    }

    /* social icons */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      color: #2c4b66;
      font-size: 1.35rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 12px -6px rgba(0, 30, 50, 0.12);
      text-decoration: none;
      position: relative;
    }

    .social-link:hover {
      background: #ffffff;
      color: #0b1f31;
      transform: translateY(-3px);
      box-shadow: 0 16px 24px -10px rgba(20, 70, 100, 0.3);
      border-color: #ffffff;
    }

    /* specific brand hover hints — subtle */
    .social-link[aria-label="GitHub"]:hover { color: #1a1e24; }
    .social-link[aria-label="LinkedIn"]:hover { color: #0a66c2; }
    .social-link[aria-label="Twitter / X"]:hover { color: #1a1e24; }
    .social-link[aria-label="Instagram"]:hover { color: #c32aa3; }
    .social-link[aria-label="Dribbble"]:hover { color: #ea4c89; }

    /* footer note */
    .card-footer {
      margin-top: 1.9rem;
      font-size: 0.75rem;
      color: #7b94ab;
      letter-spacing: 0.3px;
      font-weight: 400;
    }

    .card-footer i {
      font-size: 0.7rem;
      margin-right: 4px;
      opacity: 0.7;
    }

    /* responsive touches */
    @media (max-width: 480px) {
      .profile-card {
        padding: 1.8rem 1.2rem 1.6rem;
        border-radius: 2rem;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      .name {
        font-size: 1.8rem;
      }

      .stats {
        gap: 1.2rem;
      }

      .stat-value {
        font-size: 1.5rem;
      }

      .social-link {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
        border-radius: 16px;
      }

      .bio {
        font-size: 0.92rem;
        padding: 0 0.2rem;
      }
    }

    @media (max-width: 360px) {
      .stats {
        gap: 0.6rem;
      }
      .stat-item {
        min-width: 55px;
      }
      .social-links {
        gap: 0.6rem;
      }
    }

    /* focus accessibility */
    .social-link:focus-visible {
      outline: 3px solid #2b6c9e;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- avatar -->
    <div class="avatar-wrapper">
      <img class="avatar" src="./michael.jpg" alt="Michael">
    </div>

    <!-- name & title -->
    <h1 class="name">Michael</h1>
    <div class="role">Creative Developer</div>

    <!-- bio (personal & versatile) -->
    <p class="bio">
      Building thoughtful digital experiences with clean code & good coffee. 
      Passionate about open source, UI craft, and making the web a little nicer.
    </p>
        <span class="stat-label">Following</span>
      </div>
    </div>

    <!-- subtle divider -->
    <div class="divider"></div>

    <!-- social icons (font awesome) -->
    <div class="social-links">
      <a href="https://github.com/mrmichaelchapo-del" class="social-link" aria-label="GitHub" title="GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://linkedin.com/Michael" class="social-link" aria-label="LinkedIn" title="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>
      <a href="https://x.com/Michael" class="social-link" aria-label="Twitter / X" title="Twitter / X">
        <i class="fab fa-x-twitter"></i>
      </a>
      <a href="https://instagram.com/Michael" class="social-link" aria-label="Instagram" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://dribbble.com/Michael chapo" class="social-link" aria-label="Dribbble" title="Dribbble">
        <i class="fab fa-dribbble"></i>
      </a>
    </div>

    <!-- footer note -->
    <div class="card-footer">
      <i class="fas fa-map-pin"></i>Cleveland, US · always building
    </div>
  </div>

</body>
</html>
